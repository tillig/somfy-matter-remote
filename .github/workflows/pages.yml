name: Deploy Web Flasher

# Publishes the browser-based firmware flasher (web-flasher/) to GitHub Pages.
# The page uses ESP Web Tools and points at the firmware attached to the latest
# GitHub Release, so it does not need rebuilding when firmware changes; it only
# redeploys when the flasher page itself changes.

# Republishing on a version tag is what keeps the served firmware current. It
# deliberately triggers on the tag rather than on "release: published": a release
# created by the default GITHUB_TOKEN (which is how release.yml publishes) raises
# no events that start further workflow runs, so a release trigger never fires
# and the page would keep serving the previous firmware.
#
# The tag push starts this and release.yml at the same time, so the download step
# waits for the assets to appear rather than assuming they already exist.
#
# There is deliberately no "paths" filter. It would apply to tag pushes as well,
# and a tag usually points at a commit that changed no flasher file, so the tag
# trigger would be filtered out and never republish. The deploy takes about 20
# seconds, so running it on every push to main costs little.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, and do not cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The firmware is served from the Pages origin rather than linked from the
      # GitHub Release. A release asset URL redirects cross-origin to
      # objects.githubusercontent.com, which the browser blocks as a CORS
      # violation, so ESP Web Tools' fetch fails with a bare "Failed to fetch".
      # Same-origin copies avoid the redirect entirely.
      - name: Fetch release firmware into the flasher directory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # On a tag push this workflow and release.yml start together, so the
          # assets may not be attached yet. Retry until they are rather than
          # publishing a page whose firmware links 404. release.yml builds the
          # firmware, so allow it several minutes.
          for attempt in $(seq 1 40); do
            if gh release download --repo "$GITHUB_REPOSITORY" \
                 --pattern 'firmware.bin' \
                 --pattern 'firmware.factory.bin' \
                 --dir web-flasher --clobber; then
              echo "Downloaded release firmware on attempt $attempt."
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "Release assets did not appear in time." >&2
              exit 1
            fi
            echo "Assets not ready (attempt $attempt); waiting 15s."
            sleep 15
          done
          ls -l web-flasher

      - name: Upload flasher as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-flasher

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
